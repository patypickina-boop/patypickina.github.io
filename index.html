<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Localizador de Parceiros Sema - MPDFT</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f6f8; }
  header { background: #1b5e20; color: #fff; padding: 16px; text-align: center; }
  header h1 { font-size: 20px; }
  header p { font-size: 13px; opacity: .85; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; justify-content: center; background: #fff; }
  #cep-input { flex: 1 1 220px; max-width: 340px; padding: 10px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; }
  button { padding: 10px 16px; border: none; border-radius: 6px; background: #2e7d32; color: #fff; font-size: 14px; cursor: pointer; }
  button.secundario { background: #607d8b; }
  button:hover { filter: brightness(1.1); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px; justify-content: center; background: #fff; }
  .chip { padding: 6px 14px; border-radius: 16px; background: #eee; border: 1px solid #ccc; cursor: pointer; font-size: 13px; }
  .chip.ativo { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  #mapa { height: 55vh; min-height: 320px; }
  #lista { max-width: 700px; margin: 16px auto; padding: 0 12px; }
  .card { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .card h3 { font-size: 16px; color: #1b5e20; }
  .card .dist { font-size: 12px; color: #2e7d32; font-weight: bold; }
  .card p { font-size: 13px; color: #555; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>Localizador de Parceiros Sema - MPDFT</h1>
  <p>Encontre instituições parceiras próximas a você</p>
</header>

<div class="controls">
  <input type="text" id="cep-input" placeholder="Digite CEP ou endereço (ex: 71900-100)">
  <button onclick="searchLocation()">Buscar</button>
  <button onclick="meuGPS()">Meu GPS</button>
  <button class="secundario" onclick="limpar()">Limpar</button>
</div>

<div class="filtros" id="filtros"></div>
<div id="mapa"></div>
<div id="lista"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ======================================================================
// DADOS DOS PARCEIROS
// Substitua/complete este array com os 409 registros da sua planilha.
// Colunas: nome | programa | endereco | cep | lat (E) | lng (F) | categoria
// Coordenadas devem usar PONTO decimal (-15.8123). O código também
// aceita vírgula e converte automaticamente.
// ======================================================================
const parceiros = [
  { nome: "13º Grupamento De Bombeiro Militar", programa: "Serviços",
    endereco: "Vila do Pequenino Jesus, Brasília, DF", cep: "71615-600",
    lat: "-15.7997", lng: "-47.8645", categoria: "Serviços" },
  { nome: "[EXEMPLO] Parceiro Águas Claras", programa: "Pecuniária",
    endereco: "Rua 12 Sul, Águas Claras, DF", cep: "71900-100",
    lat: "-15.8372", lng: "-48.0166", categoria: "Pecuniária" }
  // ... cole aqui os demais registros da planilha
];

const CATEGORIAS = ["Todos", "Serviços", "Pecuniária", "Saúde", "Palestras"];
let categoriaAtiva = "Todos";
let userPos = null;
let mapa, originMarker, grupoMarcadores;

// ============================ MAPA ====================================
mapa = L.map('mapa').setView([-15.7939, -47.8828], 11); // centro de Brasília
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(mapa);
grupoMarcadores = L.layerGroup().addTo(mapa);

function toNum(v) {
  const n = parseFloat(String(v ?? '').replace(',', '.'));
  return isNaN(n) ? null : n;
}

// ===================== FILTROS E RENDERIZAÇÃO =========================
function montarFiltros() {
  const div = document.getElementById('filtros');
  div.innerHTML = '';
  CATEGORIAS.forEach(c => {
    const n = c === 'Todos' ? parceiros.length
            : parceiros.filter(p => p.categoria === c).length;
    const chip = document.createElement('div');
    chip.className = 'chip' + (c === categoriaAtiva ? ' ativo' : '');
    chip.textContent = `${c} (${n})`;
    chip.onclick = () => { categoriaAtiva = c; montarFiltros(); exibirParceiros(); };
    div.appendChild(chip);
  });
}

function filtrados() {
  return categoriaAtiva === 'Todos'
    ? parceiros : parceiros.filter(p => p.categoria === categoriaAtiva);
}

function distanciaKm(lat1, lng1, lat2, lng2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function exibirParceiros() {
  const lista = document.getElementById('lista');
  grupoMarcadores.clearLayers();
  let itens = filtrados().map(p => {
    const lat = toNum(p.lat), lng = toNum(p.lng);
    return { ...p, lat, lng,
      dist: (userPos && lat !== null && lng !== null)
            ? distanciaKm(userPos[0], userPos[1], lat, lng) : null };
  });

  // Com localização definida: ordena por proximidade e mostra os 20 mais próximos
  if (userPos) itens = itens.sort((a, b) => a.dist - b.dist).slice(0, 20);

  itens.forEach(p => {
    if (p.lat !== null && p.lng !== null)
      L.marker([p.lat, p.lng]).addTo(grupoMarcadores)
        .bindPopup(`<b>${p.nome}</b><br>${p.endereco}`);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${p.nome}</h3>
      <span class="dist">${p.dist !== null ? p.dist.toFixed(1) + ' km' : ''}</span>
      <p>${p.endereco} — CEP ${p.cep}</p><p>${p.programa}</p>`;
    lista.appendChild(card);
  });
}

// ==================== CORREÇÃO DA BUSCA POR CEP =======================
// 1. BrasilAPI: só aceita coordenada se houver RUA identificada
//    (evita o centroide único de Brasília que fazia tudo cair no mesmo lugar)
// 2. Nunca geocodifica o CEP como texto: usa o endereço retornado
// 3. Fallback do Nominatim usa o parâmetro próprio "postalcode"
// 4. countrycodes=br impede retorno de endereços homônimos no exterior
async function searchLocation() {
  const input = document.getElementById('cep-input').value.trim();
  if (input.length < 3) return alert('Digite um CEP ou endereço válido');
  const isCEP = /^[0-9]{5}-?[0-9]{3}$/.test(input.replace(/\s/g, ''));
  try {
    if (isCEP) {
      const cepLimpo = input.replace(/\D/g, '');
      const r = await fetch(`https://brasilapi.com.br/api/cep/v2/${cepLimpo}`);
      if (r.ok) {
        const d = await r.json();
        if (d.location && d.location.coordinates && d.street) {
          setUserPos(parseFloat(d.location.coordinates.latitude),
                     parseFloat(d.location.coordinates.longitude),
                     `CEP ${input} — ${d.street}`);
          return;
        }
        const endereco = [d.street, d.neighborhood, d.city, d.state]
          .filter(Boolean).join(', ');
        if (endereco) {
          const ok = await geocodeNominatim(endereco, `CEP ${input}`);
          if (ok) return;
        }
      }
      const osmR = await fetch(
        'https://nominatim.openstreetmap.org/search?format=json&limit=1' +
        `&countrycodes=br&postalcode=${cepLimpo}&q=Distrito Federal`);
      const osmD = await osmR.json();
      if (osmD && osmD.length > 0) {
        setUserPos(parseFloat(osmD[0].lat), parseFloat(osmD[0].lon), `CEP ${input}`);
        return;
      }
      alert('CEP não localizado. Digite também o nome da rua ou bairro.');
      return;
    }
    await geocodeNominatim(`${input}, Distrito Federal, Brasil`, input);
  } catch (e) { alert('Erro ao buscar localização. Verifique sua conexão.'); }
}

async function geocodeNominatim(query, label) {
  const resp = await fetch(
    'https://nominatim.openstreetmap.org/search?format=json&limit=1' +
    `&countrycodes=br&addressdetails=1&q=${encodeURIComponent(query)}`);
  const dados = await resp.json();
  if (dados && dados.length > 0) {
    setUserPos(parseFloat(dados[0].lat), parseFloat(dados[0].lon), label);
    return true;
  }
  alert('Localização não encontrada. Tente incluir rua, número ou bairro.');
  return false;
}

// ================================ GPS =================================
function meuGPS() {
  if (!navigator.geolocation) return alert('GPS não suportado neste dispositivo.');
  navigator.geolocation.getCurrentPosition(
    pos => setUserPos(pos.coords.latitude, pos.coords.longitude, 'Minha localização (GPS)'),
    () => alert('Não foi possível obter sua localização. Autorize o acesso ao GPS.'));
}

function setUserPos(lat, lng, label) {
  userPos = [lat, lng];
  if (originMarker) mapa.removeLayer(originMarker);
  originMarker = L.marker(userPos, { draggable: true }).addTo(mapa)
    .bindPopup(`<b>${label}</b><br>(arraste para ajustar)`).openPopup();
  mapa.setView(userPos, 14);
  exibirParceiros();
}

function limpar() {
  userPos = null;
  if (originMarker) { mapa.removeLayer(originMarker); originMarker = null; }
  document.getElementById('cep-input').value = '';
  mapa.setView([-15.7939, -47.8828], 11);
  exibirParceiros();
}

// Busca também com a tecla Enter
document.getElementById('cep-input')
  .addEventListener('keydown', e => { if (e.key === 'Enter') searchLocation(); });

montarFiltros();
exibirParceiros();
</script>
</body>
</html>
