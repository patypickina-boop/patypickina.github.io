<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Localizador de Parceiros SEMA - MPDFT</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root { --primary: #002147; --accent: #e91e63; --bg: #f4f7f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--primary); color: white; padding: 15px 25px; z-index: 1000; }
        main { flex: 1; display: flex; overflow: hidden; position: relative; }
        #sidebar { width: 400px; background: white; display: flex; flex-direction: column; box-shadow: 2px 0 15px rgba(0,0,0,0.1); z-index: 900; }
        .filter-container { padding: 20px; border-bottom: 1px solid #eee; }
        
        .select-group { margin-bottom: 12px; }
        .select-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 14px; color: var(--primary); font-weight: bold; }
        
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2196f3; }
        .input-group input { width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        
        .category-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .pill { padding: 8px 15px; border-radius: 25px; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: white; opacity: 0.6; transition: 0.3s; }
        .pill.active { opacity: 1; transform: scale(1.05); }
        
        #results-list { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #ddd; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { font-size: 1rem; color: var(--primary); margin-bottom: 8px; }
        .card p { font-size: 0.85rem; color: #666; margin-bottom: 4px; }
        
        #map { flex: 1; z-index: 1; }
        @media (max-width: 768px) { #sidebar { width: 100%; position: absolute; height: 100%; transform: translateX(-100%); } #sidebar.active { transform: translateX(0); } }
    </style>
</head>
<body>

<header>
    <h1>Localizador de Parceiros SEMA - MPDFT</h1>
    <p>Filtro por Cidade Satélite e Proximidade</p>
</header>

<main>
    <aside id="sidebar">
        <div class="filter-container">
            <div class="input-group">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Busca por nome ou programa...">
            </div>

            <div class="select-group">
                <select id="satelite-filter" onchange="applyFilters()">
                    <option value="Todos">Todas as Cidades Satélites</option>
                    <option value="Águas Claras">Águas Claras</option>
                    <option value="Brasília">Brasília (Plano Piloto)</option>
                    <option value="Ceilândia">Ceilândia</option>
                    <option value="Taguatinga">Taguatinga</option>
                    <option value="Gama">Gama</option>
                    <option value="Guará">Guará</option>
                    <option value="Samambaia">Samambaia</option>
                    <option value="Lago Sul">Lago Sul</option>
                    <option value="Lago Norte">Lago Norte</option>
                    <option value="Sudoeste">Sudoeste/Octogonal</option>
                    <option value="Cruzeiro">Cruzeiro</option>
                </select>
            </div>

            <div class="category-pills">
                <div class="pill active" style="background:#2196f3" onclick="filterCategory('Todos', this)">Todos</div>
                <div class="pill" style="background:#4caf50" onclick="filterCategory('Prestação de serviços', this)">Serviços</div>
                <div class="pill" style="background:#ff9800" onclick="filterCategory('Prestação Pecuniária', this)">Pecuniária</div>
            </div>
        </div>
        <div id="results-list"></div>
    </aside>
    <div id="map"></div>
</main>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/179e4ywz97TK1_oCVbIy258SgTasQ-P0H6jnHKfB0Zgw/export?format=csv';
    let map, markers = [], allData = [], currentCategory = 'Todos';

    function init() {
        map = L.map('map').setView([-15.7942, -47.8822], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        loadData();
        document.getElementById('search-input').addEventListener('input', applyFilters);
    }

    function loadData() {
        Papa.parse(SHEET_URL, {
            download: true, header: true, skipEmptyLines: true,
            complete: (results) => {
                allData = results.data.map(item => {
                    let lat = parseFloat(String(item['Latitude'] || "").replace(',', '.'));
                    let lng = parseFloat(String(item['Longitude'] || "").replace(',', '.'));
                    return {
                        nome: item['Nome Completo'] || item['Nome da Instituição'] || item['Nome '],
                        endereco: item['Endereço'],
                        satelite: item['Cidade Satélite'] || "Não informado",
                        programas: item['Programa'] || item['Programas'] || "",
                        lat: lat, lng: lng,
                        raw: JSON.stringify(item).toLowerCase()
                    };
                });
                applyFilters();
            }
        });
    }

    function applyFilters() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const satelite = document.getElementById('satelite-filter').value;
        
        const filtered = allData.filter(i => {
            const matchSearch = i.raw.includes(search);
            const matchSatelite = satelite === 'Todos' || i.satelite.includes(satelite);
            const matchCat = currentCategory === 'Todos' || i.programas.toLowerCase().includes(currentCategory.toLowerCase());
            return matchSearch && matchSatelite && matchCat;
        });
        render(filtered);
    }

    function render(data) {
        const list = document.getElementById('results-list');
        list.innerHTML = '';
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        data.forEach(item => {
            if(!item.lat) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h3>${item.nome}</h3><p><i class="fas fa-map-marker-alt"></i> ${item.satelite}</p><p>${item.endereco}</p>`;
            card.onclick = () => map.flyTo([item.lat, item.lng], 17);
            list.appendChild(card);
            markers.push(L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.nome));
        });
    }

    function filterCategory(cat, el) {
        currentCategory = cat;
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        applyFilters();
    }

    window.onload = init;
</script>
</body>
</html>
