<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Localizador de Parceiros Sema - MPDFT</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f6f8; }
  header { background: #1b5e20; color: #fff; padding: 16px; text-align: center; }
  header h1 { font-size: 20px; }
  header p { font-size: 13px; opacity: .85; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; justify-content: center; background: #fff; }
  #cep-input { flex: 1 1 220px; max-width: 340px; padding: 10px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; }
  button { padding: 10px 16px; border: none; border-radius: 6px; background: #2e7d32; color: #fff; font-size: 14px; cursor: pointer; }
  button.secundario { background: #607d8b; }
  button:hover { filter: brightness(1.1); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px; justify-content: center; background: #fff; }
  .chip { padding: 6px 14px; border-radius: 16px; background: #eee; border: 1px solid #ccc; cursor: pointer; font-size: 13px; }
  .chip.ativo { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  #mapa { height: 55vh; min-height: 320px; }
  #status { max-width: 700px; margin: 12px auto 0; padding: 0 12px; font-size: 13px; color: #555; }
  #lista { max-width: 700px; margin: 12px auto 16px; padding: 0 12px; }
  .card { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .card h3 { font-size: 16px; color: #1b5e20; }
  .card .dist { font-size: 12px; color: #2e7d32; font-weight: bold; }
  .card p { font-size: 13px; color: #555; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>Localizador de Parceiros Sema - MPDFT</h1>
  <p>Encontre instituições parceiras próximas a você</p>
</header>

<div class="controls">
  <input type="text" id="cep-input" placeholder="Digite CEP, endereço, programa ou nome">
  <button onclick="searchLocation()">Buscar</button>
  <button onclick="meuGPS()">Meu GPS</button>
  <button class="secundario" onclick="limpar()">Limpar</button>
</div>

<div class="filtros" id="filtros"></div>
<div id="mapa"></div>
<div id="status"></div>
<div id="lista"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ======================================================================
// BANCO DE DADOS — carregado DIRETO da planilha Google.
// Ao editar a planilha, o aplicativo reflete automaticamente na próxima
// abertura. Colunas: Nome | Endereço | CEP | Horário | Programa | Lat | Lng
// ======================================================================
const URL_PLANILHA =
  'https://docs.google.com/spreadsheets/d/179e4ywz97TK1_oCVbIy258SgTasQ-P0H6jnHKfB0Zgw/gviz/tq?tqx=out:csv';

let parceiros = [];
let CATEGORIAS = [];
let categoriaAtiva = 'Todos';
let textoBusca = '';
let userPos = null;
let mapa, originMarker, grupoMarcadores;

// ============================ UTILITÁRIOS =============================
const norm = s => String(s ?? '').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

function toNum(v) {
  const n = parseFloat(String(v ?? '').replace(',', '.'));
  return isNaN(n) ? null : n;
}

// Parser de CSV com suporte a campos entre aspas
function parseCSV(texto) {
  const linhas = []; let linha = [], campo = '', entreAspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (entreAspas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') entreAspas = false;
      else campo += c;
    } else if (c === '"') entreAspas = true;
    else if (c === ',') { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      linha.push(campo); campo = '';
      if (linha.length > 1 || linha[0] !== '') linhas.push(linha);
      linha = [];
    } else campo += c;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}

// ===================== CARREGAMENTO DA PLANILHA =======================
async function carregarDados() {
  try {
    const resp = await fetch(URL_PLANILHA);
    const texto = await resp.text();
    const linhas = parseCSV(texto);
    if (linhas.length < 2) throw new Error('planilha vazia');
    const head = linhas[0].map(h => norm(h));
    const iNome = head.findIndex(h => h.startsWith('nome'));
    const iEnd  = head.findIndex(h => h.includes('endereço') || h.includes('endereco'));
    const iCep  = head.indexOf('cep');
    const iHor  = head.findIndex(h => h.includes('horário') || h.includes('horario'));
    const iProg = head.indexOf('programa');
    const iLat  = head.indexOf('latitude');
    const iLng  = head.indexOf('longitude');

    const cats = new Set();
    parceiros = linhas.slice(1).map(l => ({
      nome:     (l[iNome] || '').trim(),
      endereco: (l[iEnd]  || '').trim(),
      cep:      (l[iCep]  || '').trim(),
      horario:  (l[iHor]  || '').trim(),
      programa: (l[iProg] || '').trim(),
      lat: toNum(l[iLat]), lng: toNum(l[iLng])
    })).filter(p => p.nome);

    parceiros.forEach(p => p.programa.split(/[;,\n]/).forEach(x => {
      const c = x.trim(); if (c) cats.add(c);
    }));
    CATEGORIAS = ['Todos', ...[...cats].sort()];
  } catch (e) {
    document.getElementById('status').textContent =
      'Não foi possível carregar a planilha. Verifique se ela está compartilhada como "qualquer pessoa com o link".';
  }
  montarFiltros();
  exibirParceiros();
}

// ===================== FILTROS E RENDERIZAÇÃO =========================
function categoriasDe(p) {
  return p.programa.split(/[;,\n]/).map(x => x.trim()).filter(Boolean);
}

function buscarNoBanco() {
  if (!textoBusca) return parceiros;
  const t = norm(textoBusca);
  return parceiros.filter(p =>
    norm(p.nome).includes(t) || norm(p.endereco).includes(t) ||
    norm(p.cep.replace(/\D/g, '')).includes(t.replace(/\D/g, '')) ||
    norm(p.horario).includes(t) || norm(p.programa).includes(t));
}

function montarFiltros() {
  const div = document.getElementById('filtros');
  div.innerHTML = '';
  const base = buscarNoBanco(); // respeita o texto digitado
  CATEGORIAS.forEach(c => {
    const n = c === 'Todos' ? base.length
            : base.filter(p => categoriasDe(p).includes(c)).length;
    const chip = document.createElement('div');
    chip.className = 'chip' + (c === categoriaAtiva ? ' ativo' : '');
    chip.textContent = `${c} (${n})`;
    chip.onclick = () => { categoriaAtiva = c; montarFiltros(); exibirParceiros(); };
    div.appendChild(chip);
  });
}

function distanciaKm(lat1, lng1, lat2, lng2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function exibirParceiros() {
  const lista = document.getElementById('lista');
  const status = document.getElementById('status');
  lista.innerHTML = '';
  grupoMarcadores.clearLayers();
  let itens = buscarNoBanco()
    .filter(p => categoriaAtiva === 'Todos' || categoriasDe(p).includes(categoriaAtiva))
    .map(p => ({ ...p,
      dist: (userPos && p.lat !== null && p.lng !== null)
            ? distanciaKm(userPos[0], userPos[1], p.lat, p.lng) : null }));

  if (textoBusca && itens.length)
    status.textContent = `${itens.length} resultado(s) no banco de dados para "${textoBusca}"`;
  else if (textoBusca)
    status.textContent = `Nenhum registro do banco para "${textoBusca}" — buscando como endereço no mapa.`;
  else
    status.textContent = userPos ? 'Resultados ordenados pela sua localização.' : '';

  if (userPos) itens = itens.sort((a, b) => (a.dist ?? 1e9) - (b.dist ?? 1e9));
  if (userPos && !textoBusca) itens = itens.slice(0, 20);

  itens.forEach(p => {
    if (p.lat !== null && p.lng !== null)
      L.marker([p.lat, p.lng]).addTo(grupoMarcadores)
        .bindPopup(`<b>${p.nome}</b><br>${p.endereco}`);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${p.nome}</h3>
      <span class="dist">${p.dist !== null ? p.dist.toFixed(1) + ' km' : ''}</span>
      <p>${p.endereco}${p.cep ? ' — CEP ' + p.cep : ''}</p>
      ${p.horario ? `<p><b>Horário:</b> ${p.horario}</p>` : ''}
      ${p.programa ? `<p><b>Programa:</b> ${p.programa}</p>` : ''}`;
    lista.appendChild(card);
  });
}

// ==================== BUSCA: CEP OU TEXTO =============================
// CEP: ViaCEP primeiro (logradouro preciso) -> geocodifica o ENDEREÇO.
//      BrasilAPI só como último recurso (coordenadas postais no DF são
//      imprecisas — era a causa do pino cair no Núcleo Bandeirante).
// Texto: 1º procura no banco (nome/programa/endereço/CEP/horário);
//        só se não achar, geocodifica como endereço no DF.
async function searchLocation() {
  const input = document.getElementById('cep-input').value.trim();
  if (input.length < 3) return alert('Digite um CEP, endereço, programa ou nome');
  const isCEP = /^[0-9]{5}-?[0-9]{3}$/.test(input.replace(/\s/g, ''));
  try {
    if (isCEP) {
      await buscarCEP(input.replace(/\D/g, ''), input);
      return;
    }
    // 1. Procura primeiro no banco de dados
    textoBusca = input; categoriaAtiva = 'Todos';
    const achou = buscarNoBanco().length > 0;
    montarFiltros(); exibirParceiros();
    if (achou) {
      const primeiro = buscarNoBanco().find(p => p.lat !== null && p.lng !== null);
      if (primeiro) mapa.setView([primeiro.lat, primeiro.lng], 14);
      return;
    }
    // 2. Não achou no banco: geocodifica como endereço
    const ok = await geocodeNominatim(`${input}, Brasília, DF, Brasil`, input)
            || await geocodeNominatim(`${input}, Distrito Federal, Brasil`, input);
    if (ok) { textoBusca = ''; montarFiltros(); exibirParceiros(); }
    else textoBusca = '';
  } catch (e) { alert('Erro ao buscar. Verifique sua conexão.'); }
}

// Dentro do DF: rejeita resultados fora da caixa (proteção extra)
function dentroDoDF(lat, lng) {
  return lat > -16.1 && lat < -15.4 && lng > -48.4 && lng < -47.2;
}

async function buscarCEP(cepLimpo, input) {
  // 1) ViaCEP -> endereço completo -> geocodificador de rua
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
    const d = await r.json();
    if (d && !d.erro) {
      const endereco = [d.logradouro, d.bairro, d.localidade, d.uf]
        .filter(Boolean).join(', ');
      if (await geocodeNominatim(endereco, `CEP ${input} — ${d.logradouro || ''}`)) return;
    }
  } catch (e) {}
  // 2) BrasilAPI: só aceita se identificar a RUA
  try {
    const r = await fetch(`https://brasilapi.com.br/api/cep/v2/${cepLimpo}`);
    if (r.ok) {
      const d = await r.json();
      const lat = toNum(d.location?.coordinates?.latitude);
      const lng = toNum(d.location?.coordinates?.longitude);
      if (d.street && lat !== null && lng !== null && dentroDoDF(lat, lng)) {
        setUserPos(lat, lng, `CEP ${input} — ${d.street}`); return;
      }
      const endereco = [d.street, d.neighborhood, d.city, d.state]
        .filter(Boolean).join(', ');
      if (endereco && await geocodeNominatim(endereco, `CEP ${input}`)) return;
    }
  } catch (e) {}
  // 3) Último recurso: parâmetro postalcode do Nominatim
  try {
    const osmR = await fetch(
      'https://nominatim.openstreetmap.org/search?format=json&limit=1' +
      `&countrycodes=br&postalcode=${cepLimpo}&q=Distrito Federal`);
    const osmD = await osmR.json();
    if (osmD && osmD.length > 0 &&
        dentroDoDF(parseFloat(osmD[0].lat), parseFloat(osmD[0].lon))) {
      setUserPos(parseFloat(osmD[0].lat), parseFloat(osmD[0].lon), `CEP ${input}`);
      return;
    }
  } catch (e) {}
  alert('CEP não localizado com precisão. Digite também a rua ou o bairro.');
}

async function geocodeNominatim(query, label) {
  const resp = await fetch(
    'https://nominatim.openstreetmap.org/search?format=json&limit=1' +
    `&countrycodes=br&q=${encodeURIComponent(query)}`);
  const dados = await resp.json();
  if (dados && dados.length > 0) {
    const lat = parseFloat(dados[0].lat), lng = parseFloat(dados[0].lon);
    if (!dentroDoDF(lat, lng)) return false; // fora do DF: rejeita
    setUserPos(lat, lng, label);
    return true;
  }
  return false;
}

// ================================ GPS =================================
function meuGPS() {
  if (!navigator.geolocation) return alert('GPS não suportado neste dispositivo.');
  navigator.geolocation.getCurrentPosition(
    pos => { textoBusca = ''; setUserPos(pos.coords.latitude, pos.coords.longitude, 'Minha localização (GPS)'); },
    () => alert('Não foi possível obter sua localização. Autorize o acesso ao GPS.'));
}

function setUserPos(lat, lng, label) {
  userPos = [lat, lng];
  if (originMarker) mapa.removeLayer(originMarker);
  originMarker = L.marker(userPos, { draggable: true }).addTo(mapa)
    .bindPopup(`<b>${label}</b><br>(arraste para ajustar)`).openPopup();
  mapa.setView(userPos, 14);
  exibirParceiros();
}

function limpar() {
  userPos = null; textoBusca = ''; categoriaAtiva = 'Todos';
  document.getElementById('cep-input').value = '';
  if (originMarker) { mapa.removeLayer(originMarker); originMarker = null; }
  mapa.setView([-15.7939, -47.8828], 11);
  montarFiltros(); exibirParceiros();
}

// Busca também com a tecla Enter
document.getElementById('cep-input')
  .addEventListener('keydown', e => { if (e.key === 'Enter') searchLocation(); });

// ============================ MAPA E INÍCIO ===========================
mapa = L.map('mapa').setView([-15.7939, -47.8828], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(mapa);
grupoMarcadores = L.layerGroup().addTo(mapa);

carregarDados();
</script>
</body>
</html>
