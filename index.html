<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Localizador de Parceiros SEMA - MPDFT</title>

    <!-- Bibliotecas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f5; display: flex; flex-direction: column; height: 100vh; }

        header {
            background: #1b5e20; color: #fff; text-align: center;
            padding: 14px 10px; flex-shrink: 0; z-index: 1000;
        }
        header h1 { font-size: 20px; font-weight: 600; }
        header p { font-size: 12px; opacity: .85; margin-top: 2px; }

        #layout { display: flex; flex: 1; overflow: hidden; }

        /* ===== SIDEBAR (layout original) ===== */
        #sidebar {
            width: 280px; background: #fff; padding: 14px; overflow-y: auto;
            border-right: 1px solid #ddd; flex-shrink: 0; z-index: 1000;
        }
        .filter-container { margin-bottom: 18px; }
        .filter-title {
            font-size: 14px; font-weight: 700; color: #1b5e20;
            margin-bottom: 10px; border-bottom: 2px solid #1b5e20; padding-bottom: 6px;
        }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 4px; }
        #cep-input {
            width: 100%; padding: 9px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px;
        }
        #cep-input:focus { outline: 2px solid #2e7d32; border-color: #2e7d32; }
        .btn-row { display: flex; gap: 6px; margin-bottom: 4px; }
        .btn {
            flex: 1; padding: 9px 8px; border: none; border-radius: 6px; font-size: 13px;
            font-weight: 600; cursor: pointer; color: #fff; display: flex; align-items: center;
            justify-content: center; gap: 6px; transition: filter .15s;
        }
        .btn:hover { filter: brightness(1.12); }
        .btn-verde { background: #2e7d32; }
        .btn-azul { background: #1565c0; }
        .btn-cinza { background: #607d8b; }
        #checkbox-categorias { display: flex; flex-direction: column; gap: 6px; }
        #checkbox-categorias label {
            font-size: 13px; color: #333; display: flex; align-items: center;
            gap: 8px; cursor: pointer; padding: 4px 6px; border-radius: 4px;
        }
        #checkbox-categorias label:hover { background: #f0f4f0; }
        #checkbox-categorias input { accent-color: #2e7d32; width: 15px; height: 15px; }

        /* ===== ÁREA PRINCIPAL ===== */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #status {
            padding: 8px 14px; font-size: 13px; color: #333; background: #e8f5e9;
            border-bottom: 1px solid #c8e6c9; min-height: 20px; flex-shrink: 0;
        }
        #status.erro { background: #fdecea; border-color: #f5c6cb; }
        #mapa { flex: 1; min-height: 300px; }
        #lista { overflow-y: auto; max-height: 40vh; padding: 12px; background: #eef2f5; }
        .card {
            background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.1); border-left: 4px solid #2e7d32;
        }
        .card h3 { font-size: 15px; color: #1b5e20; }
        .card .dist { font-size: 12px; color: #2e7d32; font-weight: 700; }
        .card p { font-size: 13px; color: #555; margin-top: 4px; }
        .card p i { color: #2e7d32; width: 16px; }

        #menu-toggle { display: none; }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            #layout { position: relative; }
            #sidebar {
                position: absolute; left: -290px; top: 0; bottom: 0;
                transition: left .25s ease; box-shadow: 2px 0 8px rgba(0,0,0,.2);
            }
            #sidebar.aberto { left: 0; }
            #menu-toggle {
                display: flex; position: absolute; top: 10px; left: 10px; z-index: 1100;
                background: #1b5e20; color: #fff; border: none; border-radius: 6px;
                padding: 10px 12px; font-size: 16px; cursor: pointer;
            }
            #lista { max-height: 45vh; }
        }
    </style>
</head>
<body>

<header>
    <h1><i class="fas fa-map-location-dot"></i> Localizador de Parceiros SEMA - MPDFT</h1>
    <p>Encontre instituições parceiras próximas a você</p>
</header>

<button id="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('aberto')">
    <i class="fas fa-bars"></i>
</button>

<div id="layout">
    <!-- ===== SIDEBAR ===== -->
    <aside id="sidebar">
        <div class="filter-container">
            <div class="filter-title"><i class="fas fa-filter"></i> Filtros</div>

            <div class="input-group">
                <label>CEP, endereço, programa ou palavra-chave</label>
                <input type="text" id="cep-input" placeholder="Ex: 70160-900, bombeiro, Guará...">
            </div>

            <div class="btn-row">
                <button class="btn btn-verde" onclick="searchCEP()"><i class="fas fa-magnifying-glass"></i> Buscar</button>
                <button class="btn btn-azul" onclick="meuGPS()"><i class="fas fa-location-crosshairs"></i> Meu GPS</button>
            </div>
            <div class="btn-row">
                <button class="btn btn-cinza" onclick="limpar()"><i class="fas fa-eraser"></i> Limpar</button>
            </div>
        </div>

        <div class="filter-container">
            <div class="filter-title"><i class="fas fa-list-check"></i> Programas</div>
            <div id="checkbox-categorias"></div>
        </div>
    </aside>

    <!-- ===== ÁREA PRINCIPAL ===== -->
    <div id="main">
        <div id="status"></div>
        <div id="mapa"></div>
        <div id="lista"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ======================================================================
// BANCO DE DADOS — carregado DIRETO da planilha Google (409 registros).
// Colunas: Nome | Endereço | CEP | Horário | Programa | Latitude | Longitude
// Ao editar a planilha, o app reflete na próxima abertura.
// ======================================================================
const URL_PLANILHA =
  'https://docs.google.com/spreadsheets/d/179e4ywz97TK1_oCVbIy258SgTasQ-P0H6jnHKfB0Zgw/gviz/tq?tqx=out:csv';

let parceiros = [];
let categoriasAtivas = new Set(); // vazio = todas
let textoBusca = '';
let userPos = null;
let mapa, originMarker, grupoMarcadores;

// ============================ UTILITÁRIOS =============================
const norm = s => String(s ?? '').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

function toNum(v) {
  const n = parseFloat(String(v ?? '').replace(',', '.'));
  return isNaN(n) ? null : n;
}

function showStatus(msg, tipo) {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = tipo === 'error' ? 'erro' : '';
}

// Parser de CSV com suporte a campos entre aspas
function parseCSV(texto) {
  const linhas = []; let linha = [], campo = '', entreAspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (entreAspas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') entreAspas = false;
      else campo += c;
    } else if (c === '"') entreAspas = true;
    else if (c === ',') { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      linha.push(campo); campo = '';
      if (linha.length > 1 || linha[0] !== '') linhas.push(linha);
      linha = [];
    } else campo += c;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}

// ===================== CARREGAMENTO DA PLANILHA =======================
async function carregarDados() {
  try {
    const resp = await fetch(URL_PLANILHA);
    const texto = await resp.text();
    const linhas = parseCSV(texto);
    if (linhas.length < 2) throw new Error('planilha vazia');
    const head = linhas[0].map(h => norm(h));
    const iNome = head.findIndex(h => h.startsWith('nome'));
    const iEnd  = head.findIndex(h => h.includes('endereço') || h.includes('endereco'));
    const iCep  = head.indexOf('cep');
    const iHor  = head.findIndex(h => h.includes('horário') || h.includes('horario'));
    const iProg = head.indexOf('programa');
    const iLat  = head.indexOf('latitude');
    const iLng  = head.indexOf('longitude');

    const cats = new Set();
    parceiros = linhas.slice(1).map(l => ({
      nome:     (l[iNome] || '').trim(),
      endereco: (l[iEnd]  || '').trim(),
      cep:      (l[iCep]  || '').trim(),
      horario:  (l[iHor]  || '').trim(),
      programa: (l[iProg] || '').trim(),
      lat: toNum(l[iLat]), lng: toNum(l[iLng])
    })).filter(p => p.nome);

    parceiros.forEach(p => p.programa.split(/[;,\n]/).forEach(x => {
      const c = x.trim(); if (c) cats.add(c);
    }));
    montarCheckboxes([...cats].sort());
    exibirParceiros();
  } catch (e) {
    showStatus('Não foi possível carregar a planilha. Verifique se ela está compartilhada como "qualquer pessoa com o link".', 'error');
  }
}

// ===================== FILTROS E RENDERIZAÇÃO =========================
function montarCheckboxes(cats) {
  const box = document.getElementById('checkbox-categorias');
  box.innerHTML = '';
  cats.forEach(c => {
    const lb = document.createElement('label');
    lb.innerHTML = `<input type="checkbox" checked> ${c}`;
    lb.querySelector('input').onchange = e => {
      if (e.target.checked) categoriasAtivas.delete(c);
      else categoriasAtivas.add(c);
      exibirParceiros();
    };
    box.appendChild(lb);
  });
}

function categoriasDe(p) {
  return p.programa.split(/[;,\n]/).map(x => x.trim()).filter(Boolean);
}

function buscarNoBanco() {
  if (!textoBusca) return parceiros;
  const t = norm(textoBusca);
  const tNum = t.replace(/\D/g, '');
  return parceiros.filter(p =>
    norm(p.nome).includes(t) || norm(p.endereco).includes(t) ||
    (tNum && norm(p.cep).includes(tNum)) ||
    norm(p.horario).includes(t) || norm(p.programa).includes(t));
}

function distanciaKm(lat1, lng1, lat2, lng2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function exibirParceiros() {
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  grupoMarcadores.clearLayers();
  let itens = buscarNoBanco()
    .filter(p => p.programa && categoriasDe(p).some(c => !categoriasAtivas.has(c)))
    .map(p => ({ ...p,
      dist: (userPos && p.lat !== null && p.lng !== null)
            ? distanciaKm(userPos[0], userPos[1], p.lat, p.lng) : null }));

  if (userPos) itens = itens.sort((a, b) => (a.dist ?? 1e9) - (b.dist ?? 1e9));
  if (userPos && !textoBusca) itens = itens.slice(0, 20);

  if (textoBusca && itens.length) showStatus(`${itens.length} resultado(s) para "${textoBusca}"`);
  else if (textoBusca) showStatus(`Nenhum registro do banco para "${textoBusca}"`);
  else if (userPos) showStatus('Resultados ordenados pela sua localização.');
  else showStatus(`${parceiros.length} parceiros carregados da planilha.`);

  itens.forEach(p => {
    if (p.lat !== null && p.lng !== null)
      L.marker([p.lat, p.lng]).addTo(grupoMarcadores)
        .bindPopup(`<b>${p.nome}</b><br>${p.endereco}`);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${p.nome}</h3>
      <span class="dist">${p.dist !== null ? p.dist.toFixed(1) + ' km' : ''}</span>
      <p><i class="fas fa-location-dot"></i> ${p.endereco}${p.cep ? ' — CEP ' + p.cep : ''}</p>
      ${p.horario ? `<p><i class="fas fa-clock"></i> ${p.horario}</p>` : ''}
      ${p.programa ? `<p><i class="fas fa-handshake"></i> ${p.programa}</p>` : ''}`;
    lista.appendChild(card);
  });
}

// ==================== BUSCA: CEP OU TEXTO =============================
async function searchCEP() {
  const input = document.getElementById('cep-input').value.trim();
  if (input.length < 3) return showStatus('Digite um CEP, endereço, programa ou palavra.', 'error');
  const isCEP = /^[0-9]{5}-?[0-9]{3}$/.test(input.replace(/\s/g, ''));

  try {
    if (isCEP) {
      await localizarCEP(input.replace(/\D/g, ''), input);
      return;
    }
    // Busca por texto: 1º no banco de dados, depois como endereço
    textoBusca = input;
    exibirParceiros();
    const primeiro = buscarNoBanco().find(p => p.lat !== null && p.lng !== null);
    if (primeiro) { mapa.setView([primeiro.lat, primeiro.lng], 14); return; }
    const ok = await geocodeNominatim(`${input}, Brasília, DF, Brasil`, input)
            || await geocodeNominatim(`${input}, Distrito Federal, Brasil`, input);
    if (!ok) showStatus(`Nada encontrado para "${input}". Tente outro termo.`, 'error');
  } catch (e) {
    showStatus('Erro na busca. Verifique sua conexão.', 'error');
  }
}

// Caixa do DF — rejeita resultados fora do Distrito Federal
function dentroDoDF(lat, lng) {
  return lat > -16.1 && lat < -15.4 && lng > -48.4 && lng < -47.2;
}

// CEP: ViaCEP -> endereço por extenso -> Nominatim (precisão de RUA).
// Coordenadas da BrasilAPI ficam como ÚLTIMO recurso (no DF elas são
// imprecisas e faziam o pino cair no lugar errado).
async function localizarCEP(cepLimpo, input) {
  showStatus('Localizando endereço...');
  // 1) ViaCEP -> endereço -> geocodificador
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
    const d = await r.json();
    if (d && !d.erro) {
      const tentativas = [
        [d.logradouro, d.bairro, d.localidade, d.uf].filter(Boolean).join(', '),
        [d.logradouro, d.localidade, d.uf].filter(Boolean).join(', '),
        [d.bairro, d.localidade, d.uf].filter(Boolean).join(', ')
      ].filter(Boolean);
      for (const query of tentativas) {
        if (await geocodeNominatim(query, `CEP ${input} — ${d.logradouro || d.bairro}`)) return;
      }
    }
  } catch (e) {}
  // 2) BrasilAPI: último recurso, com validação de lat E lng no DF
  try {
    const r = await fetch(`https://brasilapi.com.br/api/cep/v2/${cepLimpo}`);
    if (r.ok) {
      const d = await r.json();
      const lat = toNum(d.location?.coordinates?.latitude);
      const lng = toNum(d.location?.coordinates?.longitude);
    if (lat !== null && lng !== null && dentroDoDF(lat, lng)) {
        setUserPos(lat, lng, `CEP ${input} (aproximado)`);
        return;
      }
    }
  } catch (e) {}
  showStatus('CEP não localizado com precisão. Digite também a rua ou o bairro.', 'error');
}

async function geocodeNominatim(query, label) {
  const resp = await fetch(
    'https://nominatim.openstreetmap.org/search?format=json&limit=1' +
    `&countrycodes=br&viewbox=-48.28,-15.45,-47.30,-16.05&bounded=1` +
    `&q=${encodeURIComponent(query)}`);
  const dados = await resp.json();
  if (dados && dados.length > 0) {
    const lat = parseFloat(dados[0].lat), lng = parseFloat(dados[0].lon);
    if (!dentroDoDF(lat, lng)) return false;
    setUserPos(lat, lng, label);
    return true;
  }
  return false;
}

// ================================ GPS =================================
function meuGPS() {
  if (!navigator.geolocation) return showStatus('GPS não suportado neste dispositivo.', 'error');
  showStatus('Obtendo sua localização...');
  navigator.geolocation.getCurrentPosition(
    pos => { textoBusca = ''; setUserPos(pos.coords.latitude, pos.coords.longitude, 'Minha localização (GPS)'); },
    () => showStatus('Não foi possível obter sua localização. Autorize o acesso ao GPS.', 'error'));
}

function setUserPos(lat, lng, label) {
  userPos = [lat, lng];
  if (originMarker) mapa.removeLayer(originMarker);
  originMarker = L.marker(userPos, { draggable: true }).addTo(mapa)
    .bindPopup(`<b>${label}</b><br>(arraste para ajustar)`).openPopup();
  mapa.setView(userPos, 14);
  exibirParceiros();
}

function limpar() {
  userPos = null; textoBusca = '';
  categoriasAtivas = new Set();
  document.querySelectorAll('#checkbox-categorias input').forEach(c => c.checked = true);
  document.getElementById('cep-input').value = '';
  if (originMarker) { mapa.removeLayer(originMarker); originMarker = null; }
  mapa.setView([-15.7939, -47.8828], 11);
  exibirParceiros();
}

document.getElementById('cep-input')
  .addEventListener('keydown', e => { if (e.key === 'Enter') searchCEP(); });

// ============================ MAPA E INÍCIO ===========================
mapa = L.map('mapa').setView([-15.7939, -47.8828], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(mapa);
grupoMarcadores = L.layerGroup().addTo(mapa);

carregarDados();
</script>
</body>
</html>
